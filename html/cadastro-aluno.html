<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTube | Criar Conta Aluno</title>
    <link rel="stylesheet" href="../css/log-Cad-aluno.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Edu<span class="logo-bold">Tube</span></span>
            </div>

            <h2>Criar sua conta</h2>
            <p class="subtitle">Junte-se a milhares de profissionais hoje.</p>

            <form class="auth-form">
                <div class="input-group">
                    <label for="name">Nome Completo</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="name" placeholder="Ex: Ana Silva" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-mail (pessoal ou institucional)</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="ana@empresa.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Criar Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Criar minha conta</button>
            </form>

            <p class="footer-text">Já possui conta? <a href="login-aluno.html">Fazer login</a></p>
        </div>
    </div>
<script src="../javascript/Cadastro-aluno.js"></script>
</body>
</html>
