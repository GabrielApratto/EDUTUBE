<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTube | Login Aluno</title>
     <link rel="stylesheet" href="../css/log-Cad-aluno.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Edu<span class="logo-bold">Tube</span></span>
            </div>

            <h2>Bem-vindo de volta</h2>
            <p class="subtitle">Acesse sua conta para continuar seus cursos.</p>

            <form class="auth-form">
                <div class="input-group">
                    <label for="email">E-mail Profissional</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-flex">
                        <label for="password">Senha</label>
                        <a href="#" class="forgot-link">Esqueceu a senha?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Entrar na Plataforma</button>
            </form>

            <div class="divider">
                <span>ou entrar com</span>
            </div>

            <div class="social-grid">
                <a href="Login.html" class="btn-aluno">Entrar como Profissional</a>
            </div>

            <p class="footer-text">Não tem uma conta? <a href="cadastro-aluno.html">Cadastre-se grátis</a></p>
        </div>
    </div>
<script src="../javascript/Login-aluno.js"></script>
</body>
</html>
