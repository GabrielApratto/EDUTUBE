<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTube | Perfil do Aluno</title>
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <header class="navbar">
        <div class="nav-left">
            <i class="fa-solid fa-bars menu-icon"></i>
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Edu<span class="logo-bold">Tube</span></span>
            </div>
        </div>
        <div class="nav-right">
            <i class="fa-regular fa-bell icon-btn"></i>
            <div class="user-avatar-nav">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=60"
                    alt="Foto de Perfil" data-user-avatar>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="home-aluno.html" class="menu-item"><i class="fa-solid fa-house"></i> Início</a>
                <a href="explorar-aluno.html" class="menu-item"><i class="fa-solid fa-compass"></i> Explorar Áreas</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-book-bookmark"></i> Concursos</a>
                <hr>
                <a href="perfil-aluno.html" class="menu-item active"><i class="fa-solid fa-user-tie"></i> Perfil</a>
                <hr>

            </nav>
        </aside>

        <main class="content">
            <div class="profile-container">
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="avatar-wrapper">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80"
                                alt="Foto de Perfil" class="profile-avatar">
                            <button class="btn-edit-avatar" title="Alterar foto de perfil">
                                <i class="fa-solid fa-camera"></i>
                            </button>
                        </div>
                        <div class="profile-title-area">
                            <h2 class="profile-name" data-profile-name>Aluno Exemplar</h2>
                            <p class="profile-status">Membro Estudante</p>
                        </div>
                    </div>

                    <div class="profile-details">
                        <div class="detail-item">
                            <div class="detail-info">
                                <span class="detail-label">E-mail</span>
                                <span class="detail-value" data-profile-email>aluno@exemplo.com</span>
                            </div>
                            <button class="btn-edit-field" title="Editar E-mail">
                                <i class="fa-regular fa-pen-to-square"></i> Editar
                            </button>
                        </div>
                        <div class="detail-item">
                            <div class="detail-info">
                                <span class="detail-label">Cursos em Progresso</span>
                                <span class="detail-value">3</span>
                            </div>
                            <button class="btn-edit-field" title="Ver cursos">
                                <i class="fa-regular fa-eye"></i> Ver
                            </button>
                        </div>
                    </div>
                </div>

                <div class="stats-sidebar">
                    <div class="stat-box">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <div>
                            <h4>18</h4>
                            <p>Aulas Concluídas</p>
                        </div>
                    </div>
                    <div class="stat-box">
                        <i class="fa-solid fa-star"></i>
                        <div>
                            <h4>4.9</h4>
                            <p>Avaliação Média</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../javascript/usuario.js"></script>
</body>

</html>
